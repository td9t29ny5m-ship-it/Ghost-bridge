<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install {{name}}</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#6e6e73;--accent:#007aff;--warn-bg:#fff4e5;--warn:#8a5300}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989f;--accent:#0a84ff;--warn-bg:#3a2a10;--warn:#ffcc66}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:32px 16px}
.card{max-width:420px;margin:0 auto;background:var(--card);border-radius:18px;padding:28px 20px;text-align:center}
.icon{width:88px;height:88px;border-radius:20px;margin:0 auto 14px;background:linear-gradient(135deg,var(--accent),#5e5ce6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700}
h1{font-size:22px;margin:0 0 4px}
.meta{color:var(--muted);font-size:14px;word-break:break-all}
.btn{display:block;margin-top:20px;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;text-decoration:none}
.link{display:inline-block;margin-top:14px;color:var(--accent);font-size:14px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px;font-size:14px;margin-top:16px;display:none}
.warn.show{display:block}
.note{color:var(--muted);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">{{initial}}</div>
  <h1>{{name}}</h1>
  <div class="meta">Version {{version}} · {{size}}</div>
  <div class="meta">{{bundleId}}</div>
  <a class="btn" href="{{installUrl}}">Install</a>
  <a class="link" href="{{downloadUrl}}">Download .ipa instead</a>
  <div class="warn {{https}}">This link is not HTTPS, so iOS will refuse to install from it.</div>
  <p class="note">Open this page in Safari on your iPhone or iPad. After tapping Install, go to your Home Screen to watch it download.</p>
</div>
</body>
</html>
