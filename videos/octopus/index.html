<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>pop-shorts</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="scenes.js"></script>
    <script src="words.js"></script>
    <style>
      @font-face { font-family: "Head"; src: url("assets/fonts/Montserrat-ExtraBold.ttf") format("truetype"); font-weight: 800; }
      :root { --yel: #ffd60a; --ink: #0b0b0f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .shot { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
      .shot .img { position: absolute; inset: 0; background-size: cover; background-position: center; will-change: transform; }
      #shade { position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      .layer { position: absolute; inset: 0; pointer-events: none; }
      .title { position: absolute; left: 60px; right: 150px; text-align: center; font-family: "Head", sans-serif; line-height: 0.98; color: #fff;
        -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-transform: uppercase; white-space: pre-line; filter: drop-shadow(0 10px 0 rgba(0,0,0,0.35)); }
      .title em { font-style: normal; color: var(--yel); }
      .num { position: absolute; left: 60px; right: 150px; text-align: center; font-family: "Head", sans-serif; color: var(--yel); line-height: 1;
        -webkit-text-stroke: 20px var(--ink); paint-order: stroke fill; filter: drop-shadow(0 12px 0 rgba(0,0,0,0.35)); }
      .badge { position: absolute; left: 60px; top: 250px; padding: 14px 34px 18px; border-radius: 999px; background: var(--yel); color: var(--ink); font-family: "Head", sans-serif; font-size: 64px;
        box-shadow: 0 8px 0 var(--ink); border: 6px solid var(--ink); text-transform: uppercase; }
      .sticker { position: absolute; filter: drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(0 14px 12px rgba(0,0,0,0.45)); }
      #caps { position: absolute; left: 60px; right: 150px; top: 1250px; height: 260px; display: grid; place-items: center; pointer-events: none; }
      .cap { position: absolute; font-family: "Head", sans-serif; font-size: 100px; line-height: 1.02; text-align: center; color: #fff; text-transform: uppercase;
        -webkit-text-stroke: 14px var(--ink); paint-order: stroke fill; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.4)); visibility: hidden; }
      .cap span.on { color: var(--yel); }
      #bar { position: absolute; left: 0; top: 0; height: 12px; background: var(--yel); box-shadow: 0 2px 0 var(--ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37.30" data-width="1080" data-height="1920">
      <div id="shots"></div>
      <div id="shade"></div>
      <div class="layer" id="over"></div>
      <div id="caps"></div>
      <div id="flash"></div>
      <div id="bar"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="37.30" data-track-index="0"></audio>
    </div>
    <script>
      // POP shorts engine: full-screen shots that hard-cut with a zoom punch, bold outlined text, count-up numbers,
      // stickers and word-by-word captions. render(t) is a pure function of film time t (HyperFrames seeks it).
      window.__timelines = window.__timelines || {};
      const F = window.FILM || { duration: 10, shots: [] };
      const DUR = F.duration;
      const $ = (s) => document.querySelector(s);
      const C = (x) => Math.min(1, Math.max(0, x));
      const P = (t, a, b) => C((t - a) / (b - a));
      const L = (a, b, p) => a + (b - a) * p;
      const eo = (x) => 1 - Math.pow(1 - x, 3);
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const back = (x) => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const SH = F.shots.slice().sort((a, b) => a.t - b.t);
      SH.forEach((s, i) => { s.end = SH[i + 1] ? SH[i + 1].t : DUR; });

      // ---------- build shots + overlays ----------
      const OV = [];
      SH.forEach((s, i) => {
        const d = document.createElement("div"); d.className = "shot"; const im = document.createElement("div"); im.className = "img";
        im.style.backgroundImage = `url("${s.img}")`; d.appendChild(im); $("#shots").appendChild(d); s.el = d; s.im = im;
        const z = s.zoom || (i % 2 ? [1.16, 1.04] : [1.04, 1.16]); s.z = z;
        s.pan = s.pan || [[0, 0], [0, i % 3 === 0 ? -40 : i % 3 === 1 ? 30 : 0]];
        (s.over || []).forEach((o) => { o.shot = s; o.at = o.at ?? s.t; o.until = o.until ?? s.end; const e = document.createElement("div");
          if (o.type === "title") { e.className = "title"; e.innerHTML = String(o.text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\*(.+?)\*/g, "<em>$1</em>"); e.style.top = `${o.y ?? 300}px`; e.style.fontSize = `${o.size ?? 130}px`; }
          else if (o.type === "num") { e.className = "num"; e.style.top = `${o.y ?? 320}px`; e.style.fontSize = `${o.size ?? 300}px`; }
          else if (o.type === "badge") { e.className = "badge"; e.textContent = o.text; if (o.y) e.style.top = `${o.y}px`; }
          else if (o.type === "sticker") { e.className = "sticker"; e.innerHTML = `<img src="${o.src}" style="width:${o.w ?? 260}px" />`; e.style.left = `${o.x ?? 700}px`; e.style.top = `${o.y ?? 300}px`; }
          e.style.visibility = "hidden"; $("#over").appendChild(e); o.el = e; OV.push(o); });
      });

      // ---------- captions: 1–3 words per chunk, active word yellow, each chunk pops ----------
      const WORDS = (window.WORDS || []).filter((w) => w.w && w.w.trim());
      const CH = []; { let c = []; const flush = () => { if (c.length) { CH.push(c); c = []; } };
        WORDS.forEach((w, i) => { c.push(w); const nx = WORDS[i + 1]; const len = c.reduce((n, x) => n + x.w.length + 1, 0);
          if (/[.!?,:]$/.test(w.w) || !nx || nx.s - w.e > 0.35 || c.length >= 3 || len + (nx ? nx.w.length : 0) > 15) flush(); }); flush(); }
      const capEls = CH.map((c, i) => { const d = document.createElement("div"); d.className = "cap";
        const sp = c.map((w, j) => { const s = document.createElement("span"); s.textContent = w.w.replace(/[,.]$/, ""); d.appendChild(s); if (j < c.length - 1) d.appendChild(document.createTextNode(" ")); return s; });
        $("#caps").appendChild(d); const nx = CH[i + 1]; return { d, sp, c, a: c[0].s, end: nx ? nx[0].s : c[c.length - 1].e + 0.6 }; });

      function render(t) {
        // shots: cut-in punch (1.14→1 in 0.28 s) on top of a slow Ken Burns, a little shake on the cut
        SH.forEach((s, i) => {
          const on = t >= s.t && t < s.end; s.el.style.visibility = on ? "visible" : "hidden"; if (!on) return;
          const p = P(t, s.t, s.end), k = eo(P(t, s.t, s.t + 0.28));
          const z = L(s.z[0], s.z[1], eio(p)) * L(1.14, 1, k);
          const sx = (1 - k) * Math.sin(t * 90) * 14, sy = (1 - k) * Math.cos(t * 77) * 10;
          s.im.style.transform = `translate(${L(s.pan[0][0], s.pan[1][0], p) + sx}px, ${L(s.pan[0][1], s.pan[1][1], p) + sy}px) scale(${z})`;
        });
        const cur = SH.find((s) => t >= s.t && t < s.end); const f = cur && cur.t > 0 ? 1 - P(t, cur.t, cur.t + 0.12) : 0;
        $("#flash").style.opacity = (f * 0.55).toFixed(3);
        // overlays
        OV.forEach((o) => { const on = t >= o.at && t < o.until; o.el.style.visibility = on ? "visible" : "hidden"; if (!on) return;
          const q = P(t, o.at, o.at + 0.32), r = o.rot ?? (o.type === "title" ? -3 : 0); const wob = Math.sin((t - o.at) * 3) * 1.2;
          if (o.type === "num") { const v = Math.round(L(o.from ?? 0, o.to, eo(P(t, o.at, o.at + (o.dur ?? 0.7))))); o.el.textContent = `${o.prefix ?? ""}${v}${o.suffix ?? ""}`; }
          const s = o.type === "badge" ? 1 : L(0.3, 1, back(q));
          const dx = o.type === "badge" ? L(-500, 0, eo(q)) : 0;
          o.el.style.transform = `translateX(${dx}px) rotate(${r + (o.type === "badge" ? 0 : wob)}deg) scale(${s})`; o.el.style.opacity = C(q * 4); });
        // captions
        capEls.forEach((c) => { const on = t >= c.a && t < c.end; c.d.style.visibility = on ? "visible" : "hidden"; if (!on) return;
          const q = P(t, c.a, c.a + 0.14); c.d.style.transform = `scale(${L(0.78, 1, back(q))}) rotate(${L(-4, 0, eo(q))}deg)`;
          let k = -1; c.c.forEach((w, j) => { if (t >= w.s) k = j; }); c.sp.forEach((s, j) => s.classList.toggle("on", j === k)); });
        $("#bar").style.width = `${(C(t / DUR) * 1080).toFixed(1)}px`;
      }
      const tl = gsap.timeline({ paused: true }); const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0); window.__timelines["main"] = tl;
    </script>
  </body>
</html>
