<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14204a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Build a food empire in a living 3D miniature world. Buy land, choose your shops, hire chefs and expand from the suburbs to the metropolis.">
  <title>Yum Empire</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="city" aria-label="Your city"></canvas>

    <!-- Top HUD: player, resources -->
    <header class="hud-top">
      <button id="avatarBtn" class="avatar" type="button" aria-label="Profile and settings">
        <span class="av-face">🧑‍🍳</span><span id="lvBadge" class="av-lv">1</span>
      </button>
      <div class="hud-id">
        <div class="xp" aria-label="Experience"><div id="xpFill"></div><span id="xpText">0 / 50 XP</span></div>
        <button id="districtBtn" class="chip-btn" type="button">🏡 Maple Suburb</button>
      </div>
      <div class="res-col">
        <div class="res cash"><i>💵</i><b id="cash">$0</b></div>
        <div class="res-row">
          <button id="gemBtn" class="res gems" type="button" aria-label="Gems"><i>💎</i><b id="gems">0</b><span class="plus">+</span></button>
          <div class="res stars"><i>⭐</i><b id="stars">0</b></div>
        </div>
      </div>
    </header>
    <div class="hud-sub"><span id="ips" class="ips"></span><span id="statusRow" class="pills"></span></div>

    <!-- Side buttons -->
    <div class="side left">
      <button class="sbtn" type="button" data-panel="quests"><span>📜</span><small>Quests</small><i class="badge" id="badge-quests"></i></button>
      <button class="sbtn" type="button" data-panel="shops" id="listBtn"><span>🏪</span><small>Shops</small></button>
      <button class="sbtn" type="button" data-panel="awards"><span>🏆</span><small>Awards</small></button>
    </div>
    <div class="side right">
      <button class="sbtn boost" type="button" id="boostBtn"><span>🚀</span><small id="boostLabel">2× Boost</small></button>
      <button class="sbtn" type="button" id="crateBtn"><span>🎁</span><small id="crateLabel">Crate</small><i class="badge" id="badge-crate"></i></button>
      <button class="sbtn" type="button" data-panel="store"><span>🛍️</span><small>Store</small></button>
    </div>

    <!-- Selected plot -->
    <div id="shopCard" class="card"></div>

    <!-- Bottom navigation -->
    <nav class="nav">
      <button type="button" data-panel="staff"><span>👩‍🍳</span><small>Chefs</small><i class="badge" id="badge-staff"></i></button>
      <button type="button" data-panel="research"><span>🔬</span><small>Research</small><i class="badge" id="badge-research"></i></button>
      <button type="button" id="navCity" class="nav-main"><span>🏙️</span><small>City</small></button>
      <button type="button" data-panel="world"><span>🗺️</span><small>World</small><i class="badge" id="badge-world"></i></button>
      <button type="button" data-panel="franchise"><span>⭐</span><small>Franchise</small><i class="badge" id="badge-franchise"></i></button>
    </nav>

    <!-- Pop-up window used by every menu -->
    <div id="panel" class="panel" hidden>
      <div class="panel-win">
        <div class="panel-head"><span id="panelIcon" class="panel-icon"></span><h2 id="panelTitle"></h2><button id="panelClose" class="x-btn" type="button" aria-label="Close">✕</button></div>
        <div id="panelBody" class="panel-body"></div>
      </div>
    </div>

    <button id="vip" class="vip" type="button" hidden aria-label="VIP visitor">🤩</button>
    <div id="floaters" aria-hidden="true"></div>
    <div id="toasts" aria-live="polite"></div>

    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <div class="ribbon"><span id="modalTitle"></span></div>
        <div id="modalIcon" class="modal-icon"></div>
        <div id="modalBody"></div>
        <div id="modalActions" class="modal-actions"></div>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
