<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14204a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Run your own street-food business in a living 3D miniature town. Hire cooks and farmers, grow ingredients, expand your land and upgrade your Market Hall.">
  <title>Yum Empire</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="city" aria-label="Your park"></canvas>

    <header class="hud-top">
      <button id="avatarBtn" class="avatar" type="button" aria-label="Profile and settings">
        <span class="av-face" data-ic="avatar"></span><span id="lvBadge" class="av-lv">1</span>
      </button>
      <div class="hud-id">
        <button id="clockBtn" class="chip-btn clock" type="button" aria-label="Today's report"><i id="wxIc" data-ic="sun"></i><span id="clockText">Day 1 · 12:00</span></button>
        <button id="profitBtn" class="chip-btn profit" type="button"><span id="rates">Today $0</span></button>
      </div>
      <div class="res-col">
        <div class="res cash"><i data-ic="cash"></i><b id="cash">$0</b></div>
        <div class="res-row">
          <div class="res tok" id="tokBox" hidden><i data-ic="token"></i><b id="tokens">0</b></div>
          <button id="gemBtn" class="res gems" type="button" aria-label="Gems"><i data-ic="gem"></i><b id="gems">0</b><span class="plus">+</span></button>
        </div>
      </div>
    </header>
    <div class="hud-sub"><span id="statusRow" class="pills"></span></div>
    <button id="missionBar" class="mission" type="button" hidden></button>
    <div class="quick">
      <button class="qbtn" type="button" id="crateBtn" hidden><span data-ic="gift"></span><small>Free!</small></button>
      <button class="qbtn boost" type="button" id="boostBtn" hidden><span data-ic="rocket"></span><small id="boostLabel">2×</small></button>
    </div>

    <div id="spot" class="spot" hidden></div>
    <div id="pointer" class="pointer" hidden></div>
    <div id="coach" class="coach" hidden></div>
    <div id="shopCard" class="card" hidden></div>
    <div id="placeBar" class="card place-bar" hidden></div>

    <nav class="nav">
      <button type="button" data-panel="staff" id="navStaff"><span data-ic="chefhat"></span><small>Staff</small><i class="badge" id="badge-staff"></i></button>
      <button type="button" data-panel="build" id="navBuild"><span data-ic="hammer"></span><small>Build</small><i class="badge" id="badge-build"></i></button>
      <button type="button" id="navHall" class="nav-main"><span data-ic="hall"></span><small>Hall</small><i class="badge" id="badge-hall"></i></button>
      <button type="button" data-panel="buildings" id="navBiz"><span data-ic="chart"></span><small>Business</small><i class="badge" id="badge-buildings"></i></button>
      <button type="button" data-panel="more" id="navMore"><span data-ic="quests"></span><small>More</small><i class="badge" id="badge-more"></i></button>
    </nav>

    <div id="panel" class="panel" hidden>
      <div class="panel-win">
        <div class="panel-head"><span id="panelIcon" class="panel-icon"></span><h2 id="panelTitle"></h2><button id="panelClose" class="x-btn" type="button" aria-label="Close"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 5 15 15M15 5 5 15" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg></button></div>
        <div id="panelBody" class="panel-body"></div>
      </div>
    </div>

    <div id="floaters" aria-hidden="true"></div>
    <div id="toasts" aria-live="polite"></div>

    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <div class="ribbon"><span id="modalTitle"></span></div>
        <div id="modalIcon" class="modal-icon"></div>
        <div id="modalBody"></div>
        <div id="modalActions" class="modal-actions"></div>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
