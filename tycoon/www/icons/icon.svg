  </g>
  <!-- bowl -->
  <ellipse cx="512" cy="560" rx="330" ry="70" fill="url(#soup)"/>
  <g fill="none" stroke="#f2b84b" stroke-width="16" stroke-linecap="round">
    <path d="M300 560 q60 -30 120 0 t120 0 t120 0 t110 0"/>
    <path d="M340 585 q60 -25 120 0 t120 0 t120 0"/>
