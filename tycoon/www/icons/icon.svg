  <path d="M220 610 h584" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity=".35"/>
  <rect x="402" y="850" width="220" height="40" rx="20" fill="#d9611a"/>
  <!-- face -->
  <circle cx="420" cy="690" r="26" fill="#3a1d00"/><circle cx="604" cy="690" r="26" fill="#3a1d00"/>
  <circle cx="430" cy="680" r="8" fill="#fff"/><circle cx="614" cy="680" r="8" fill="#fff"/>
  <path d="M470 740 q42 40 84 0" fill="none" stroke="#3a1d00" stroke-width="16" stroke-linecap="round"/>
  <circle cx="360" cy="735" r="24" fill="#ff5a6e" opacity=".45"/><circle cx="664" cy="735" r="24" fill="#ff5a6e" opacity=".45"/>
