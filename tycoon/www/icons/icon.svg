<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5a33b8"/><stop offset="1" stop-color="#1b1236"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="soup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c9"/><stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff07a"/><stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".12">
    <circle cx="170" cy="200" r="16"/><circle cx="860" cy="260" r="12"/><circle cx="820" cy="820" r="18"/><circle cx="200" cy="800" r="10"/>
  </g>
  <!-- crown -->
  <path d="M332 330 L372 170 L452 270 L512 140 L572 270 L652 170 L692 330 Z" fill="url(#crown)" stroke="#b86a00" stroke-width="14" stroke-linejoin="round"/>
